                font-family: arial;
                font-size: 22px;
                border: 2px solid #0000;           
                background-color: rgba(0.0, 0.0, 0.0, 0.5);
                border-radius: 10px;
                margin: 10px auto;
                width: fit-content;
                padding: 8px 20px

            }
        </style>
        </head>

                <p>Possuo um grande interesse em conhecer a área do C++ e Java.</p>

                <p></p>

</html>
